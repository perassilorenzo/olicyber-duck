name = "oliduck"
compatibility_date = "2025-04-01"
pages_build_output_dir = "public"

# Il binding AI è opzionale: senza di esso il backend risponde in modalità DEMO.
# Di default resta commentato. Per abilitarlo, decommentare le righe seguenti
# oppure aggiungere il binding da Dashboard Cloudflare (vedi docs/CLOUDFLARE.md).
# Non inserire token o API key in questo file.
[ai]
binding = "AI"

# [vars]
# Modello predefinito: @cf/zai-org/glm-4.7-flash (functions/lib/model.js).
# Impostare AI_MODEL solo per un override server-side; non è richiesto per il default.
# AI_MODEL = "@cf/zai-org/glm-4.7-flash"
